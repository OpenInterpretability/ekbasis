name: Ekbasis migration guard
description: Before a pull request is merged, foresee whether its PostgreSQL migrations lose data or fail.
author: OpenInterpretability
branding:
  icon: shield
  color: blue

inputs:
  api-key:
    description: Ekbasis API key (ekb_...). Pass it from a secret.
    required: true
  api-url:
    description: Ekbasis server.
    default: https://openinterp.org/api/v1
  base-ref:
    description: The branch the pull request merges into (default, the pull request's base).
    default: ""
  paths:
    description: Which files are migrations, one fnmatch glob per line (default, Prisma, Diesel, *.up.sql and *migrations/*.sql).
    default: ""
  lost-threshold:
    description: Risky when P(data lost) reaches this.
    default: "0.5"
  fail-threshold:
    description: Risky when P(a statement fails) reaches this.
    default: "0.5"
  autocommit:
    description: "true: statements commit one by one (psql -f). Default: one transaction per file, as Prisma, Diesel and golang-migrate run it."
    default: "false"
  mode:
    description: "comment (one PR comment, updated on each push), check (the job fails when risky), or both."
    default: both
  fail-on:
    description: "risky (fail on risky and on cannot foresee) or never."
    default: risky
  db-stats-url:
    description: Optional read-only replica URL, from a secret. Only planner statistics are read (row estimates, NULL fractions, distinct counts), never values.
    default: ""
  framework:
    description: "sql (default: SQL migration files), django or alembic. For django and alembic the framework renders the SQL, running the pull request's code only inside a container with no network and no secrets."
    default: sql
  image:
    description: Generator image for django/alembic (default python:3.12-slim).
    default: ""
  setup:
    description: "Shell command run in the generator, in the head tree, WITH network, before the network is cut (e.g. pip install -r requirements.txt)."
    default: ""
  workdir:
    description: Where manage.py or alembic.ini is, inside the repository.
    default: "."
  env:
    description: "K=V lines for the generator (${EKBASIS_DB_URL} becomes the scratch database's URL). Never put secrets here: the pull request's code reads them."
    default: ""
  migrate-command:
    description: The command that migrates the base (default per framework).
    default: ""
  alembic-command:
    description: alembic (default) or flask db.
    default: ""
  on-code:
    description: "django/alembic: a migration with code that is not SQL (RunPython, no offline SQL) is listed as 'code not foreseen, review by hand' and does not fail the check (warn, default), or fails closed (block)."
    default: warn
  postgres-image:
    description: The scratch PostgreSQL the schema is built in.
    default: postgres:16
  github-token:
    description: Token used to write the comment (needs pull-requests write).
    default: ${{ github.token }}
  verdict-cache:
    description: >-
      true: reuse the model's answer for a migration already checked with the same file, base schema, client version,
      transaction mode and statistics (30 days, in the Actions cache): no model call, no tokens. false: always ask.
    default: "true"

outputs:
  verdict:
    description: ok, risky, cannot-foresee, or code-not-foreseen (a migration with code to review by hand; does not fail the check).
    value: ${{ steps.check.outputs.verdict }}
  result:
    description: Path of the JSON result.
    value: ${{ steps.check.outputs.result }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install the Ekbasis client (this action's version)
      shell: bash
      run: python -m pip install --quiet --disable-pip-version-check "${{ github.action_path }}/../.."

    # The pull request's SQL runs here, as a throwaway role that is not a superuser (ekbasis.migrations.Scratch), in a
    # container on an internal Docker network: no route out, no published port. The guard reaches it with
    # `docker exec ... psql` (EKBASIS_SCRATCH_PSQL).
    - name: Start a scratch PostgreSQL (no network)
      shell: bash
      env:
        IMAGE: ${{ inputs.postgres-image }}
      run: |
        docker network create --internal ekbasis-mg-net >/dev/null
        docker run -d --rm --name ekbasis-mg-pg --network ekbasis-mg-net -e POSTGRES_HOST_AUTH_METHOD=trust "$IMAGE" >/dev/null
        for i in $(seq 1 60); do docker exec ekbasis-mg-pg pg_isready -U postgres -q && break; sleep 1; done
        w="$RUNNER_TEMP/ekbasis-scratch-psql"
        printf '#!/bin/sh\nexec docker exec -i ekbasis-mg-pg psql "$@"\n' > "$w" && chmod +x "$w"
        echo "EKBASIS_SCRATCH_PSQL=$w" >> "$GITHUB_ENV"
        command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null)

    - name: Fetch the base branch
      shell: bash
      env:
        BASE: ${{ inputs.base-ref || github.base_ref }}
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then git fetch --quiet --no-tags --unshallow origin; fi
        git fetch --quiet --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"

    # The verdict cache (ekbasis.migrations.VerdictCache) holds only probabilities, keyed by sha256 of everything the
    # answer depends on. Each run restores the newest copy and saves a new one; entries expire after 30 days.
    - name: Restore the verdict cache
      if: ${{ inputs.verdict-cache == 'true' }}
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/ekbasis-verdicts
        key: ekbasis-verdicts-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ekbasis-verdicts-

    # Django/Alembic: the pull request's code runs only here, inside a container that loses its network after the
    # setup, with no secret in its environment (the API key is not in this step).
    - name: Render the framework's migrations (isolated)
      if: ${{ inputs.framework != 'sql' }}
      shell: bash
      env:
        BASE: ${{ inputs.base-ref || github.base_ref }}
        FRAMEWORK: ${{ inputs.framework }}
        IMAGE: ${{ inputs.image }}
        SETUP: ${{ inputs.setup }}
        WORKDIR: ${{ inputs.workdir }}
        GEN_ENV: ${{ inputs.env }}
        MIGRATE: ${{ inputs.migrate-command }}
        ACOMMAND: ${{ inputs.alembic-command }}
      run: |
        args=(migrate-gen --framework "$FRAMEWORK" --base "origin/$BASE" --workdir "$WORKDIR" -o "$RUNNER_TEMP/ekbasis-bundle.json")
        [ -n "$IMAGE" ] && args+=(--image "$IMAGE")
        [ -n "$SETUP" ] && args+=(--setup "$SETUP")
        [ -n "$MIGRATE" ] && args+=(--migrate "$MIGRATE")
        [ -n "$ACOMMAND" ] && args+=(--command "$ACOMMAND")
        while IFS= read -r kv; do [ -n "$kv" ] && args+=(--env "$kv"); done <<< "$GEN_ENV"
        ekbasis "${args[@]}" || true

    - name: Foresee the new migrations
      id: check
      shell: bash
      env:
        EKBASIS_API_KEY: ${{ inputs.api-key }}
        EKBASIS_URL: ${{ inputs.api-url }}
        EKBASIS_PG_URL: postgresql://postgres@127.0.0.1:5432/postgres
        EKBASIS_DB_STATS_URL: ${{ inputs.db-stats-url }}
        EKBASIS_SURFACE: migration-guard-action
        EKBASIS_VERDICT_CACHE: ${{ inputs.verdict-cache == 'true' && format('{0}/ekbasis-verdicts', runner.temp) || 'off' }}
        BASE: ${{ inputs.base-ref || github.base_ref }}
        PATHS: ${{ inputs.paths }}
        LOST: ${{ inputs.lost-threshold }}
        FAIL: ${{ inputs.fail-threshold }}
        AUTOCOMMIT: ${{ inputs.autocommit }}
        FRAMEWORK: ${{ inputs.framework }}
        ON_CODE: ${{ inputs.on-code }}
      run: |
        out="$RUNNER_TEMP/ekbasis-migrations.json"
        args=(migrate-check --json --lost-threshold "$LOST" --fail-threshold "$FAIL")
        if [ "$FRAMEWORK" = "sql" ]; then
          args+=(--base "origin/$BASE")
          while IFS= read -r g; do [ -n "$g" ] && args+=(--glob "$g"); done <<< "$PATHS"
        else
          args+=(--bundle "$RUNNER_TEMP/ekbasis-bundle.json" --on-code "$ON_CODE")
        fi
        [ "$AUTOCOMMIT" = "true" ] && args+=(--autocommit)
        mark="$RUNNER_TEMP/ekbasis-cache-mark"; touch "$mark"
        set +e; ekbasis "${args[@]}" > "$out"; rc=$?; set -e
        new=0
        [ -d "$EKBASIS_VERDICT_CACHE" ] && new=$(find "$EKBASIS_VERDICT_CACHE" -name '*.json' -newer "$mark" | wc -l)
        echo "new-verdicts=$((new))" >> "$GITHUB_OUTPUT"   # saved only when this run added answers
        case "$rc" in 0) v=ok;; 2) v=risky;; *) v=cannot-foresee;; esac
        if [ "$v" = ok ] && python -c 'import json,sys; sys.exit(0 if json.loads(open(sys.argv[1]).read().splitlines()[-1]).get("code_not_foreseen") else 1)' "$out" 2>/dev/null; then
          v=code-not-foreseen     # listed for review by hand; does not fail the check (on-code: warn)
        fi
        echo "verdict=$v" >> "$GITHUB_OUTPUT"
        echo "result=$out" >> "$GITHUB_OUTPUT"
        python -m ekbasis.migrations comment "$out" > "$RUNNER_TEMP/ekbasis-comment.md"
        grep -v '^<!--' "$RUNNER_TEMP/ekbasis-comment.md" >> "$GITHUB_STEP_SUMMARY"
        echo "Ekbasis migration guard: $v"

    - name: Save the verdict cache
      if: ${{ always() && inputs.verdict-cache == 'true' && steps.check.outputs.new-verdicts > 0 }}
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/ekbasis-verdicts
        key: ekbasis-verdicts-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Comment on the pull request
      if: ${{ (inputs.mode == 'comment' || inputs.mode == 'both') && github.event.pull_request.number }}
      continue-on-error: true       # a fork's token cannot comment; the job summary still has the result
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        body="$RUNNER_TEMP/ekbasis-comment.md"
        id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
             --jq '.[] | select(.body | startswith("<!-- ekbasis-migration-guard -->")) | .id' | head -n 1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$body" >/dev/null
        elif ! grep -q "No new migration files" "$body"; then
          gh api "repos/$REPO/issues/$PR/comments" -F "body=@$body" >/dev/null
        fi

    - name: Stop the scratch PostgreSQL
      if: always()
      shell: bash
      run: |
        docker stop ekbasis-mg-pg >/dev/null 2>&1 || true
        docker network rm ekbasis-mg-net >/dev/null 2>&1 || true

    - name: Fail the check
      if: ${{ (inputs.mode == 'check' || inputs.mode == 'both') && inputs.fail-on == 'risky' && (steps.check.outputs.verdict == 'risky' || steps.check.outputs.verdict == 'cannot-foresee') }}
      shell: bash
      env:
        VERDICT: ${{ steps.check.outputs.verdict }}
      run: |
        echo "::error title=Ekbasis migration guard::$VERDICT (see the job summary or the pull request comment)"
        exit 1
