<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Split</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #06050c; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; color: #fff; }
  #root { position: relative; width: 100vw; height: 100vh; }
  .side { position: absolute; overflow: hidden; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .side iframe { border: 0; position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .label { position: absolute; display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 800; letter-spacing: -.3px; }
  .label b { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .label.l b { background: #f43f5e; box-shadow: 0 0 14px #f43f5e; } .label.r b { background: #8b5cf6; box-shadow: 0 0 14px #8b5cf6; }
  .say { position: absolute; font-size: 25px; font-weight: 600; line-height: 1.3; color: #e4e4e7; min-height: 70px; }
  .say small { display: block; font-size: 15px; font-weight: 700; letter-spacing: .6px; color: #a1a1aa; margin-bottom: 6px; text-transform: uppercase; }
  .outcome { position: absolute; padding: 14px 18px; border-radius: 14px; font-size: 24px; font-weight: 800; opacity: 0; line-height: 1.25; }
  .outcome.bad { background: rgba(244,63,94,.16); border: 1px solid rgba(244,63,94,.6); color: #fecdd3; }
  .outcome.good { background: rgba(34,197,94,.14); border: 1px solid rgba(34,197,94,.55); color: #bbf7d0; }
  #caption { position: absolute; left: 50%; transform: translateX(-50%); bottom: 34px; max-width: 86%; padding: 12px 24px; border-radius: 14px; text-align: center;
    font-size: 40px; font-weight: 800; letter-spacing: -.4px; background: rgba(8,8,14,.8); border: 1px solid rgba(255,255,255,.12); opacity: 0; }
  #caption em { font-style: normal; color: #fda4af; } #caption strong { color: #c4b5fd; }
  #card { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; opacity: 0;
    background: radial-gradient(900px 600px at 50% 40%, rgba(139,92,246,.35), transparent 70%), #07060f; }
  #card .big { font-size: 80px; font-weight: 800; letter-spacing: -2px; line-height: 1.05; max-width: 1500px; }
  #card .big em { font-style: normal; background: linear-gradient(135deg, #a78bfa, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #card .sub { margin-top: 24px; font-size: 32px; font-weight: 600; color: #c4c4cc; }
</style>
</head>
<body>
<div id="root">
  <div class="label l" id="ll"><b></b><span></span></div><div class="label r" id="lr"><b></b><span></span></div>
  <div class="side" id="sl"><iframe id="fl"></iframe></div><div class="side" id="sr"><iframe id="fr"></iframe></div>
  <div class="say" id="yl"></div><div class="say" id="yr"></div>
  <div class="outcome" id="ol"></div><div class="outcome" id="or"></div>
  <div id="caption"></div>
  <div id="card"></div>
</div>
<script type="module" src="split.js"></script>
</body>
</html>
